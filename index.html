<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruman</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="resources/icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="cursor">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="20" cy="7" rx="4" ry="8" fill="#d8b4fe" opacity="0.75" />
      <ellipse cx="20" cy="7" rx="4" ry="8" fill="#d8b4fe" opacity="0.75" transform="rotate(60 20 20)" />
      <ellipse cx="20" cy="7" rx="4" ry="8" fill="#d8b4fe" opacity="0.75" transform="rotate(120 20 20)" />
      <ellipse cx="20" cy="7" rx="4" ry="8" fill="#d8b4fe" opacity="0.75" transform="rotate(180 20 20)" />
      <ellipse cx="20" cy="7" rx="4" ry="8" fill="#d8b4fe" opacity="0.75" transform="rotate(240 20 20)" />
      <ellipse cx="20" cy="7" rx="4" ry="8" fill="#d8b4fe" opacity="0.75" transform="rotate(300 20 20)" />
      <ellipse cx="20" cy="8" rx="3.5" ry="7" fill="#c084fc" opacity="0.7" transform="rotate(30 20 20)" />
      <ellipse cx="20" cy="8" rx="3.5" ry="7" fill="#c084fc" opacity="0.7" transform="rotate(90 20 20)" />
      <ellipse cx="20" cy="8" rx="3.5" ry="7" fill="#c084fc" opacity="0.7" transform="rotate(150 20 20)" />
      <ellipse cx="20" cy="8" rx="3.5" ry="7" fill="#c084fc" opacity="0.7" transform="rotate(210 20 20)" />
      <ellipse cx="20" cy="8" rx="3.5" ry="7" fill="#c084fc" opacity="0.7" transform="rotate(270 20 20)" />
      <ellipse cx="20" cy="8" rx="3.5" ry="7" fill="#c084fc" opacity="0.7" transform="rotate(330 20 20)" />
      <ellipse cx="20" cy="13" rx="2.5" ry="4.5" fill="#a855f7" opacity="0.8" />
      <ellipse cx="20" cy="13" rx="2.5" ry="4.5" fill="#a855f7" opacity="0.8" transform="rotate(60 20 20)" />
      <ellipse cx="20" cy="13" rx="2.5" ry="4.5" fill="#a855f7" opacity="0.8" transform="rotate(120 20 20)" />
      <ellipse cx="20" cy="13" rx="2.5" ry="4.5" fill="#a855f7" opacity="0.8" transform="rotate(180 20 20)" />
      <ellipse cx="20" cy="13" rx="2.5" ry="4.5" fill="#a855f7" opacity="0.8" transform="rotate(240 20 20)" />
      <ellipse cx="20" cy="13" rx="2.5" ry="4.5" fill="#a855f7" opacity="0.8" transform="rotate(300 20 20)" />
      <circle cx="20" cy="20" r="5.5" fill="#fdf4ff" />
      <circle cx="20" cy="20" r="3.5" fill="#f3e8ff" />
      <circle cx="20" cy="20" r="1.8" fill="#a855f7" />
    </svg>
  </div>

  <div id="stars"></div>
  <div id="moon"></div>
  <div class="bg-tulips" id="bgTulips"></div>
  <div class="petal-burst" id="petalBurst"></div>

  <div id="scene">
    <div id="env-perspective">
      <div id="envelope-wrap">
        <div class="env-body">
          <div id="letter-card">
            <div class="letter-tulip">
              <svg viewBox="0 0 60 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M30 90 Q28 60 30 40" stroke="#f7879a" stroke-width="2.5" stroke-linecap="round" />
                <path d="M30 60 Q18 52 16 40 Q22 36 30 44" fill="#ff8fab" opacity="0.7" />
                <ellipse cx="30" cy="22" rx="10" ry="16" fill="#f7879a" opacity="0.85" />
                <ellipse cx="22" cy="28" rx="7" ry="14" fill="#ffb3c6" opacity="0.7" transform="rotate(-18 22 28)" />
                <ellipse cx="38" cy="28" rx="7" ry="14" fill="#ffb3c6" opacity="0.7" transform="rotate(18 38 28)" />
              </svg>
            </div>
            <div class="letter-date" id="lDate"></div>
            <div class="letter-greeting" id="lGreeting"></div>
            <div class="letter-body" id="lBody"></div>
            <div class="letter-closing" id="lClosing"></div>
            <div class="letter-sig" id="lSig"></div>
            <!-- Garden -->
            <div class="her-garden">
              <img class="her-garden-img" src="resources/flower-garden.png" alt="her garden" />
            </div>
          </div>
          <div class="env-bottom"></div>
          <div class="env-left"></div>
          <div class="env-right"></div>
          <div class="env-top-wrap"><div class="env-top"></div></div>
          <div id="heart-seal" title="Click to open ♡">
            <svg viewBox="0 0 80 72" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M40 65 C40 65 6 44 6 22 C6 12 14 5 22 5 C29 5 35 9 40 15 C45 9 51 5 58 5 C66 5 74 12 74 22 C74 44 40 65 40 65Z" fill="#c9375a" />
              <path d="M40 58 C40 58 10 40 10 22 C10 14 17 9 24 9 C31 9 36 13 40 19" fill="#e05070" opacity="0.5" />
            </svg>
          </div>
          <div id="hint">click the heart to open ♡</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Music player -->
  <div id="music-area">
    <div class="tulip-wrap" id="tulipWrap" onclick="toggleMusic()">
      <div class="tulip-ring tulip-ring-1"></div>
      <div class="tulip-ring tulip-ring-2"></div>
      <div class="tulip-ring tulip-ring-3"></div>
      <img src="resources/hellokitty.png" alt="tulip" />
    </div>
    <div class="wave-wrap" id="waveWrap">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <div style="display:flex;flex-direction:column;justify-content:center;">
      <div id="music-info">
        <span id="music-label">now playing</span>
        <span id="music-title">a song for you ♡</span>
        <span id="music-status">click to play</span>
      </div>
      <div id="track-nav">
        <button class="track-btn" onclick="prevTrack()">&#9664;</button>
        <div id="track-dot"></div>
        <button class="track-btn" onclick="nextTrack()">&#9654;</button>
      </div>
    </div>
  </div>

  <div id="yt-frame"></div>

  <!-- Top-right cluster -->
  <div id="top-right">
    <div id="theme-toggle-wrap">
      <span class="toggle-icon sun">☀️</span>
      <button id="night-toggle" aria-label="toggle night mode">
        <div class="track-stars">
          <span style="top:5px;left:8px;"></span>
          <span style="top:9px;left:18px;width:1.5px;height:1.5px;"></span>
          <span style="top:14px;left:10px;width:1.5px;height:1.5px;"></span>
        </div>
        <div class="knob-icon">☀️</div>
      </button>
      <span class="toggle-icon moon">🌙</span>
    </div>

    </svg>

    <div id="countdown">
      <div class="cd-label">days together</div>
      <div class="cd-units">
        <div class="cd-block"><span class="cd-num" id="cd-days">0</span><span class="cd-unit">days</span></div>
        <div class="cd-sep">·</div>
        <div class="cd-block"><span class="cd-num" id="cd-hrs">0</span><span class="cd-unit">hrs</span></div>
        <div class="cd-sep">·</div>
        <div class="cd-block"><span class="cd-num" id="cd-min">0</span><span class="cd-unit">min</span></div>
        <div class="cd-sep">·</div>
        <div class="cd-block"><span class="cd-num" id="cd-sec">0</span><span class="cd-unit">sec</span></div>
      </div>
    </div>

    <div id="dual-clocks">
      <div class="clock-block">
        <div class="clock-face">
          <div class="clock-hand hand-hr" id="tor-hr"></div>
          <div class="clock-hand hand-min" id="tor-min"></div>
          <div class="clock-hand hand-sec" id="tor-sec"></div>
        </div>
        <span class="clock-city">Toronto</span>
        <span class="clock-time-dig" id="tor-dig">--:--</span>
      </div>
      <div class="clock-mid">
        <span class="clock-mid-heart">♡</span>
        <span class="clock-mid-diff">9.5h</span>
        <span class="clock-mid-label">apart</span>
      </div>
      <div class="clock-block">
        <div class="clock-face">
          <div class="clock-hand hand-hr" id="del-hr"></div>
          <div class="clock-hand hand-min" id="del-min"></div>
          <div class="clock-hand hand-sec" id="del-sec"></div>
        </div>
        <span class="clock-city">Delhi</span>
        <span class="clock-time-dig" id="del-dig">--:--</span>
      </div>
    </div>

    <div id="distance-wrap">
      <span class="dist-label">distance apart</span>
      <div class="dist-heartbeat-row">
        <div class="dist-city-pin">
          <div class="dist-pin-dot tor"></div>
          <span class="dist-pin-name">toronto</span>
        </div>

      <path d="M118,10 C119,7 116,5 114,7" stroke="#c9375a" stroke-width="1.1" stroke-linecap="round" fill="none" /><ellipse cx="114" cy="6" rx="2.5" ry="1.5" fill="#f7879a" opacity="0.7" transform="rotate(20 114 6)" />
      <path d="M138,10 C137,7 140,5 142,7" stroke="#c9375a" stroke-width="1.1" stroke-linecap="round" fill="none" /><ellipse cx="142" cy="6" rx="2.5" ry="1.5" fill="#f7879a" opacity="0.7" transform="rotate(-15 142 6)" />
      <path d="M158,10 C159,13 156,15 154,13" stroke="#c9375a" stroke-width="1.1" stroke-linecap="round" fill="none" /><ellipse cx="153.5" cy="14.5" rx="2.5" ry="1.5" fill="#f7879a" opacity="0.7" transform="rotate(20 154 15)" />
      <circle cx="22" cy="14" r="1.4" fill="#c9375a" opacity="0.5" /><circle cx="44" cy="8" r="1.2" fill="#c9375a" opacity="0.5" /><circle cx="64" cy="13" r="1.3" fill="#c9375a" opacity="0.45" />
      <circle cx="88" cy="14" r="1.4" fill="#c9375a" opacity="0.5" /><circle cx="108" cy="8" r="1.2" fill="#c9375a" opacity="0.5" /><circle cx="128" cy="13" r="1.3" fill="#c9375a" opacity="0.45" />
      <circle cx="148" cy="8" r="1.2" fill="#c9375a" opacity="0.5" /><circle cx="168" cy="14" r="1.3" fill="#c9375a" opacity="0.45" />
    </svg>

  </div>

  <div id="garden-toast"></div>
  <div id="garden"></div>

  <footer id="site-footer">
    <span>made with</span>
    <span class="heart-beat">♡</span>
    <span>by</span>
    <img src="resources/duckk.png" alt="omar" id="footer-duck" />
  </footer>

  <div id="anni-overlay">
    <div id="anni-message">
      Happy Anniversary, my love ♡<br /><span style="font-size:0.55em;opacity:0.75;">one whole year of us</span>
    </div>
  </div>

  <script>
    const cursor = document.getElementById("cursor");
    document.addEventListener("mousemove", (e) => {
      cursor.style.left = e.clientX + "px";
      cursor.style.top = e.clientY + "px";
    });

    const bgTulips = document.getElementById("bgTulips");
    const tulipSVG = (s) =>
      `<svg viewBox="0 0 60 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:${s}px;height:auto"><path d="M30 95 Q28 65 30 42" stroke="#f7879a" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="30" cy="24" rx="11" ry="18" fill="#f7879a"/><ellipse cx="21" cy="30" rx="7.5" ry="15" fill="#ffb3c6" transform="rotate(-20 21 30)" opacity="0.8"/><ellipse cx="39" cy="30" rx="7.5" ry="15" fill="#ffb3c6" transform="rotate(20 39 30)" opacity="0.8"/></svg>`;
    for (let i = 0; i < 14; i++) {
      const d = document.createElement("div");
      d.className = "bt";
      d.innerHTML = tulipSVG(30 + Math.random() * 50);
      d.style.left = Math.random() * 100 + "%";
      d.style.setProperty("--r", Math.random() * 40 - 20 + "deg");
      d.style.animationDuration = 12 + Math.random() * 16 + "s";
      d.style.animationDelay = -Math.random() * 20 + "s";
      bgTulips.appendChild(d);
    }

    const wrap = document.getElementById("envelope-wrap");
    const seal = document.getElementById("heart-seal");
    const burst = document.getElementById("petalBurst");
    seal.addEventListener("click", () => {
      if (wrap.classList.contains("open")) return;
      wrap.classList.add("open");
      spawnPetals();
    });

    function spawnPetals() {
      const colors = ["#f7879a", "#ffb3c6", "#c9375a", "#ffd6e0", "#ff8fab"];
      for (let i = 0; i < 28; i++) {
        const p = document.createElement("div");
        p.className = "petal";
        const angle = (Math.PI * 2 * i) / 28 + Math.random() * 0.3;
        const dist = 100 + Math.random() * 180;
        p.style.setProperty("--a", Math.random() * 360 + "deg");
        p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
        p.style.setProperty("--ty", Math.sin(angle) * dist - 60 + "px");
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.width = 6 + Math.random() * 10 + "px";
        p.style.height = 10 + Math.random() * 14 + "px";
        p.style.animationDelay = Math.random() * 0.3 + "s";
        burst.appendChild(p);
        requestAnimationFrame(() => p.classList.add("fly"));
        setTimeout(() => p.remove(), 1600);
      }
    }

    function updateCountdown(START) {
      const now = new Date(), diff = now - START, totalSec = Math.floor(diff / 1000);
      document.getElementById("cd-days").textContent = Math.floor(totalSec / 86400);
      document.getElementById("cd-hrs").textContent = String(Math.floor((totalSec % 86400) / 3600)).padStart(2, "0");
      document.getElementById("cd-min").textContent = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
      document.getElementById("cd-sec").textContent = String(totalSec % 60).padStart(2, "0");
      if (now.getMonth() === START.getMonth() && now.getDate() === START.getDate() && now.getFullYear() > START.getFullYear()) {
        document.getElementById("anni-message").classList.add("show");
        if (!window._anniBurst) {
          window._anniBurst = true;
          for (let b = 0; b < 3; b++) setTimeout(() => spawnPetals(), b * 600);
        }
      }
    }

    function rotHand(id, deg) {
      const el = document.getElementById(id);
      if (el) el.style.transform = "rotate(" + deg + "deg)";
    }
    function updateDualClocks() {
      const now = new Date(), utcH = now.getUTCHours(), utcM = now.getUTCMinutes(), utcS = now.getUTCSeconds();
      const torH = (utcH - 4 + 24) % 24, torM = utcM, torS = utcS;
      const delTot = utcH * 60 + utcM + 330, delH = Math.floor(delTot / 60) % 24, delM = delTot % 60, delS = utcS;
      rotHand("tor-hr", (torH % 12) * 30 + torM * 0.5);
      rotHand("tor-min", torM * 6 + torS * 0.1);
      rotHand("tor-sec", torS * 6);
      rotHand("del-hr", (delH % 12) * 30 + delM * 0.5);
      rotHand("del-min", delM * 6 + delS * 0.1);
      rotHand("del-sec", delS * 6);
      const fmt = (h, m) => String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
      document.getElementById("tor-dig").textContent = fmt(torH, torM);
      document.getElementById("del-dig").textContent = fmt(delH, delM);
    }
    updateDualClocks();
    setInterval(updateDualClocks, 1000);

    const GARDEN_KEY = "tulip_garden_count";
    const GARDEN_MSGS = {
      1: "your first tulip 🌷",
      5: "a little bouquet for you 🌷🌷🌷",
      10: "ten visits — I miss you that much ♡",
      25: "twenty-five tulips, still not enough",
      50: "fifty visits. you are my favourite habit ♡",
    };
    const gardenEl = document.getElementById("garden");
    const toastEl = document.getElementById("garden-toast");

    function gardenTulipSVG(h) {
      const cols = ["#f7879a", "#ff8fab", "#c9375a", "#ffb3c6", "#e05070"],
        col = cols[Math.floor(Math.random() * cols.length)];
      return `<svg viewBox="0 0 30 52" width="${h * 0.58}" height="${h}" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 50 Q14 34 15 22" stroke="#f7879a" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="15" cy="12" rx="5.5" ry="9" fill="${col}" opacity="0.9"/><ellipse cx="10.5" cy="15" rx="3.8" ry="7.5" fill="${col}" opacity="0.6" transform="rotate(-18 10.5 15)"/><ellipse cx="19.5" cy="15" rx="3.8" ry="7.5" fill="${col}" opacity="0.6" transform="rotate(18 19.5 15)"/></svg>`;
    }
    function gardenTulipSVGNight(h) {
      const cols = ["#c9375a", "#8b3a52", "#e05070", "#5a2033", "#ff8fab"],
        col = cols[Math.floor(Math.random() * cols.length)];
      return `<svg viewBox="0 0 30 52" width="${h * 0.58}" height="${h}" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 50 Q14 34 15 22" stroke="#5a2033" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="15" cy="14" rx="5.5" ry="10" fill="${col}" opacity="0.85"/><ellipse cx="11" cy="17" rx="2.5" ry="6" fill="${col}" opacity="0.35" transform="rotate(-10 11 17)"/><ellipse cx="19" cy="17" rx="2.5" ry="6" fill="${col}" opacity="0.35" transform="rotate(10 19 17)"/></svg>`;
    }
    function renderGarden(count, night) {
      gardenEl.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const div = document.createElement("div");
        div.className = "garden-tulip";
        const h = 28 + Math.random() * 18;
        div.innerHTML = night ? gardenTulipSVGNight(h) : gardenTulipSVG(h);
        div.style.animationDelay = i * 0.07 + "s";
        gardenEl.appendChild(div);
      }
    }
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 4000);
    }

    const NIGHT_KEY = "night_mode";
    const knobIcon = document.querySelector("#night-toggle .knob-icon");
    let isNight = localStorage.getItem(NIGHT_KEY) === "true";

    function applyNight(night) {
      isNight = night;
      localStorage.setItem(NIGHT_KEY, String(night));
      document.body.classList.toggle("night", night);
      knobIcon.textContent = night ? "🌙" : "☀️";
      const count = parseInt(localStorage.getItem(GARDEN_KEY) || "1", 10);
      renderGarden(Math.min(count, 50), night);
    }
    document.getElementById("theme-toggle-wrap").addEventListener("click", () => applyNight(!isNight));
    (function autoNightCheck() {
      const h = new Date().getHours(), shouldBeNight = h >= 18 || h < 6;
      if (localStorage.getItem(NIGHT_KEY) === null) {
        applyNight(shouldBeNight);
      } else {
        applyNight(isNight);
      }
    })();

    (function buildStars() {
      const container = document.getElementById("stars");
      for (let i = 0; i < 60; i++) {
        const s = document.createElement("div");
        s.className = "star";
        const size = 1.5 + Math.random() * 2.5;
        s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random() * 75}%;left:${Math.random() * 100}%;opacity:${0.3 + Math.random() * 0.7};animation:twinkle ${2 + Math.random() * 3}s ease-in-out infinite;animation-delay:${Math.random() * 3}s;`;
        container.appendChild(s);
      }
      const style = document.createElement("style");
      style.textContent = "@keyframes twinkle{0%,100%{opacity:0.2}50%{opacity:1}}";
      document.head.appendChild(style);
    })();

    (function initGarden() {
      let count = parseInt(localStorage.getItem(GARDEN_KEY) || "0", 10);
      count++;
      localStorage.setItem(GARDEN_KEY, count);
      renderGarden(Math.min(count, 50), isNight);
      if (GARDEN_MSGS[count]) setTimeout(() => showToast(GARDEN_MSGS[count]), 1200);
    })();

    // ── Music Player ──
    // All track data comes from data.json — nothing hardcoded here
    let TRACKS = [];
    let TRACK_NAMES = [];
    let currentTrack = 0, musicPlaying = false, ytPlayer = null, ytReady = false;

    function loadYT() {
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    }

    function initTracksFromData(data) {
      if (Array.isArray(data.tracks) && data.tracks.length) {
        TRACKS = data.tracks.map((t) => t.id || t.videoId || "").filter(Boolean);
        TRACK_NAMES = data.tracks.map((t) => t.name || t.title || "untitled ♡");
      }
      // update the displayed title to the first track
      if (TRACK_NAMES.length) {
        document.getElementById("music-title").textContent = TRACK_NAMES[0];
      }
    }

    function onYouTubeIframeAPIReady() {
      if (!TRACKS.length) return; // no tracks loaded yet — will init after loadLetter
      ytReady = true;
      ytPlayer = new YT.Player("yt-frame", {
        height: "1", width: "1",
        videoId: TRACKS[currentTrack],
        playerVars: { autoplay: 0, controls: 0, loop: 0 },
        events: {
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED) nextTrack();
          },
        },
      });
    }

    function initYTPlayer() {
      if (!TRACKS.length) return;
      if (typeof YT !== "undefined" && YT.Player) {
        ytReady = true;
        ytPlayer = new YT.Player("yt-frame", {
          height: "1", width: "1",
          videoId: TRACKS[currentTrack],
          playerVars: { autoplay: 0, controls: 0, loop: 0 },
          events: {
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.ENDED) nextTrack();
            },
          },
        });
      }
      // if YT not ready yet, onYouTubeIframeAPIReady will fire and call this
    }

    function setPlayingUI(playing) {
      const tw = document.getElementById("tulipWrap");
      const ww = document.getElementById("waveWrap");
      const td = document.getElementById("track-dot");
      const ms = document.getElementById("music-status");
      const mt = document.getElementById("music-title");
      if (playing) {
        tw.classList.add("playing");
        ww.classList.add("playing");
        td.classList.add("active");
        ms.textContent = "playing...";
        mt.textContent = TRACK_NAMES[currentTrack] || "♡";
      } else {
        tw.classList.remove("playing");
        ww.classList.remove("playing");
        td.classList.remove("active");
        ms.textContent = "paused";
      }
    }

    function toggleMusic() {
      if (!ytReady || !ytPlayer) return;
      if (musicPlaying) {
        ytPlayer.pauseVideo();
        musicPlaying = false;
        setPlayingUI(false);
      } else {
        ytPlayer.playVideo();
        musicPlaying = true;
        setPlayingUI(true);
      }
    }
    function nextTrack() {
      currentTrack = (currentTrack + 1) % TRACKS.length;
      switchTrack();
    }
    function prevTrack() {
      currentTrack = (currentTrack - 1 + TRACKS.length) % TRACKS.length;
      switchTrack();
    }
    function switchTrack() {
      if (!ytReady || !ytPlayer) return;
      ytPlayer.loadVideoById(TRACKS[currentTrack]);
      document.getElementById("music-title").textContent = TRACK_NAMES[currentTrack] || "♡";
      if (musicPlaying) ytPlayer.playVideo();
      else ytPlayer.pauseVideo();
    }

    async function loadLetter() {
      let data;
      try {
        const r = await fetch("data.json");
        if (!r.ok) throw new Error();
        data = await r.json();
      } catch {
        data = {
          "myName": "Omarrrr",
          "greeting": "My Dear Rumannnn,",
          "body": [
            "Every single day I wake up grateful that you chose me. You are the tulip in my garden — rare, beautiful, and full of colour that makes the whole world brighter.",
            "I love the way you laugh at your own jokes before you finish telling them, the way you steal the blanket and somehow still look peaceful, and the way you make every ordinary moment feel like it was worth living for."
          ],
          "tracks": [
            { "id": "e3Rnsz7XWkk", "name": "a song for youuuuuu ♡" },
            { "id": "6rawUvQg2NI", "name": "another song for youuuuuu ♡" }
          ],
          "closing": "All my love, always,",
          "startDate": "2024-09-14T00:00:00" 
        };
      }

      // Load tracks from data.json, then init YouTube
      initTracksFromData(data);
      loadYT(); // loads the YouTube IFrame API script
      // initYTPlayer will be called either by onYouTubeIframeAPIReady (if API not loaded yet)
      // or immediately if the API is already available
      if (typeof YT !== "undefined" && YT.Player) {
        initYTPlayer();
      }

      const today = new Date();
      document.getElementById("lDate").textContent = today.toLocaleDateString("en-US", {
        year: "numeric", month: "long", day: "numeric",
      });
      document.getElementById("lGreeting").textContent = data.greeting || "";
      document.getElementById("lClosing").textContent = data.closing || "";
      document.getElementById("lSig").textContent = (data.myName || Math.random() < 0.5 ? "Omar ♡" : "Omarr ❤");
      // const bodyEl = document.getElementById("lBody");
      // (data.body || []).forEach((para) => {
      //   const p = document.createElement("p");
      //   p.textContent = para;
      //   bodyEl.appendChild(p);
      // });
      const bodyEl = document.getElementById("lBody");
      const body = data.body || [];
      if (body.length) {
        const start = new Date(data.startDate || "2024-09-14T00:00:00");
        const today = new Date();
        const daysSinceStart = Math.floor((today - start) / (1000 * 60 * 60 * 24));
        const index = daysSinceStart % body.length;
        const entry = body[index];

        // support both old flat strings and new { paragraphs: [] } objects
        const paragraphs = Array.isArray(entry) ? entry
          : typeof entry === "string" ? [entry]
          : (entry.paragraphs || []);

        paragraphs.forEach((para) => {
          const p = document.createElement("p");
          p.textContent = para;
          bodyEl.appendChild(p);
        });
      }
      const START = new Date(data.startDate || "2024-09-14T00:00:00");
      updateCountdown(START);
      setInterval(() => updateCountdown(START), 1000);
    }
    loadLetter();
  </script>
</body>
